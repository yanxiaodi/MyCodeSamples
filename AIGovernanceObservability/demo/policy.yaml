apiVersion: governance.toolkit/v1
name: support-agent-demo
version: "1.0"
agents: ["*"]
default_action: deny
rules:
  - name: allow-customer-lookup
    condition: "action.type == 'lookup_customer' and principal.permissions.customer_read"
    action: allow
    description: Synthetic customer support lookups require the customer:read permission.
  - name: allow-admin-deletion
    condition: "action.type == 'delete_record' and principal.role == 'support_admin' and principal.permissions.customer_delete"
    action: allow
    description: Deletion is permitted only for the simulated support-admin role with customer:delete.
  - name: deny-non-admin-deletion
    condition: "action.type == 'delete_record' and principal.role != 'support_admin'"
    action: deny
    description: Deletion is denied unless the simulated caller is a support administrator.
