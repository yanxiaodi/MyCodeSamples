# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-basic-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-governance-demo:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    project: src/agent-framework-agent-basic-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-basic-responses
    description: A basic Agent Framework agent hosted by Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: ENABLE_GOVERNANCE
        value: ${ENABLE_GOVERNANCE}
      - name: AZURE_COMMUNICATION_SERVICES_CONNECTION_STRING
        value: ${AZURE_COMMUNICATION_SERVICES_CONNECTION_STRING}
      - name: AZURE_COMMUNICATION_SERVICES_SENDER
        value: ${AZURE_COMMUNICATION_SERVICES_SENDER}
      - name: DEMO_EMAIL_RECIPIENT
        value: ${DEMO_EMAIL_RECIPIENT}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    container:
      resources:
        cpu: '0.5'
        memory: 1.0Gi
infra:
  provider: microsoft.foundry
